name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run. A push to main gets its own group, so it is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://user:password@localhost:5432/test
  AUTH_GOOGLE_ID: test-google-client-id
  AUTH_GOOGLE_SECRET: test-google-client-secret
  AUTH_SECRET: test-auth-secret-for-ci-only
  WISE_USER_ID: test-wise-user
  WISE_API_KEY: test-wise-api-key
  WISE_NAMESPACE: begifted-education
  WISE_INSTITUTE_ID: 696e1f4d90102225641cc413
  CRON_SECRET: test-cron-secret
  ENABLE_AI_SCHEDULER: "false"
  ENABLE_LINE_SCHEDULER: "false"
  TZ: Asia/Bangkok

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: npm run typecheck

  unit-test-shards:
    name: unit-tests shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: npm test -- --shard=${{ matrix.shard }}/3

  # Branch protection requires a check named unit-tests. always() makes this job run and fail
  # when a shard fails or is cancelled: a skipped required check would count as passed.
  unit-tests:
    name: unit-tests
    needs: unit-test-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.unit-test-shards.result }}" = success

  # Advisory until Kevin makes it a required check. Testcontainers gives each
  # file its own fresh Postgres, which several suites rely on.
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker pull postgres:16-alpine
      # The foot-traffic PDF suite checks its output with Poppler (pdfinfo, pdftotext, pdftoppm).
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: npm run test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      # next build also runs the TypeScript check, with its generated route types.
      - run: npm run build

  release-guards:
    name: release-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The guard script uses only Node built-ins, so this job needs no npm install.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run guard:production-route-surface
      - name: Check whitespace in changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check origin/${{ github.base_ref }}...HEAD
          else
            git diff --check HEAD^..HEAD
          fi
