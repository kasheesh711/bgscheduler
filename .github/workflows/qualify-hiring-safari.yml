name: One-time hiring PDF check in Safari

on:
  push:
    branches:
      - codex/qualify-hiring-safari-db504838-7

permissions:
  contents: read

jobs:
  safari:
    if: github.event.created && !github.event.deleted
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify the source revision
        run: |
          test "$(git rev-parse HEAD^)" = db5048388b5f57895ef7e19d61b0a36d16964590
          git diff --quiet HEAD^ HEAD -- src package.json package-lock.json tsconfig.json
          test "$(git rev-parse HEAD^^1)" = 359c97fd3c143e326068203ff83fcf7fb9d311eb
          test "$(git diff --name-only HEAD^^1 HEAD^ -- src package.json package-lock.json tsconfig.json)" = src/components/hiring/pdf-pages.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the screenshot reader and native controls
        run: |
          xcrun clang -fobjc-arc -framework Vision -framework Foundation -framework CoreGraphics scripts/dev/safari-qualification/read-pages.m -o "$RUNNER_TEMP/read-pdf-pages"
          xcrun clang -fobjc-arc -framework AppKit -framework ApplicationServices -framework Carbon scripts/dev/safari-qualification/control.m -o "$RUNNER_TEMP/safari-control"
      - name: Read the middle and final pages after real resize and zoom
        run: |
          mkdir -p evidence
          node scripts/dev/safari-qualification/fixture.mjs &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          python3 scripts/dev/safari-qualification/check.py
      - name: Keep the numbered pages and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiring-pdf-safari-db504838-7
          path: |
            evidence/*.png
            evidence/*.json
          retention-days: 7
          if-no-files-found: warn
