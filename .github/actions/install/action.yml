name: Install dependencies
description: Set up Node 24 and restore node_modules from the cache. Run npm ci only when the cache has no copy for this package.json and package-lock.json.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - id: modules
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        # package.json is in the key so a manifest change misses the cache and npm ci checks it against the lock file.
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package.json', 'package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    # Save at once, before a later step can write into node_modules.
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
